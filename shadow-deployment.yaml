# ============================================================
# ACEest Fitness & Gym - Shadow Deployment
# Task 6: Deployment Strategy 5 - Shadow Deployment
# Production traffic mirrored to shadow; users see prod only
# ============================================================

# --- Production Deployment (live) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-production
  namespace: aceest
  labels:
    app: aceest
    env: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      env: production
  template:
    metadata:
      labels:
        app: aceest
        env: production
        version: "3.1.2"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.1.2
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# --- Shadow Deployment (mirrors production traffic) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app: aceest
    env: shadow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest
      env: shadow
  template:
    metadata:
      labels:
        app: aceest
        env: shadow
        version: "3.2.4"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.2.4
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
# --- Production Service ---
apiVersion: v1
kind: Service
metadata:
  name: aceest-production-svc
  namespace: aceest
spec:
  selector:
    app: aceest
    env: production
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
---
# --- Shadow Service (internal only) ---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-svc
  namespace: aceest
spec:
  selector:
    app: aceest
    env: shadow
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP    # Internal only — not exposed to users
---
# ============================================================
# NOTE: Shadow traffic mirroring is configured at the Ingress
# or service mesh level (e.g., Istio VirtualService mirror).
# With Istio, add this VirtualService for traffic mirroring:
#
# apiVersion: networking.istio.io/v1alpha3
