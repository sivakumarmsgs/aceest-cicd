name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: sivakumarmsgs/aceest-fitness
  APP_VERSION: 3.2.4

jobs:

  lint-and-build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Lint
        run: |
          flake8 app.py --max-line-length=120 --select=E9,F63,F7,F82
          flake8 app.py --max-line-length=120 --exit-zero

  unit-tests:
    name: Automated Testing (Pytest)
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Pytest
        run: |
          mkdir -p reports
          python -m pytest tests/test_app.py -v \
            --tb=short \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=term-missing

  docker-build-push:
    name: Docker Image Assembly
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.APP_VERSION }} .
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name aceest_smoke \
            ${{ env.DOCKER_IMAGE }}:${{ env.APP_VERSION }}
          sleep 8
          curl -f http://localhost:5000/health
          docker stop aceest_smoke
          docker rm aceest_smoke
