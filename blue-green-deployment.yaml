# ============================================================
# ACEest Fitness & Gym - Blue-Green Deployment
# Task 6: Deployment Strategy 2 - Blue-Green
# ============================================================

# --- BLUE (current stable version) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app: aceest
    slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      slot: blue
  template:
    metadata:
      labels:
        app: aceest
        slot: blue
        version: "3.1.2"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.1.2
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
