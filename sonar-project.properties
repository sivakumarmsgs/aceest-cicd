# ============================================================
# ACEest Fitness & Gym - SonarQube Configuration
# Task 7: Code Quality with SonarQube
# ============================================================

sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=3.2.4

# Source and test paths
sonar.sources=.
sonar.tests=tests/
sonar.inclusions=app.py

# Python-specific settings
sonar.language=py
sonar.python.version=3.11

# Coverage and test reports
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=venv/**,**/__pycache__/**,reports/**,*.db
