# ============================================================
# ACEest Fitness & Gym - Canary Deployment
# Task 6: Deployment Strategy 3 - Canary Release
# 90% traffic → stable (v3.1.2), 10% traffic → canary (v3.2.4)
# ============================================================

# --- Stable Production (9 replicas = 90% traffic) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels:
    app: aceest
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: aceest
      track: stable
  template:
    metadata:
      labels:
        app: aceest
        track: stable
        version: "3.1.2"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.1.2
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# --- Canary (1 replica = 10% traffic) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app: aceest
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
        version: "3.2.4"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.2.4
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# --- Shared Service (routes to both stable + canary) ---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
  namespace: aceest
spec:
  selector:
    app: aceest         # Matches BOTH stable and canary pods
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
