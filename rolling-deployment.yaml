# ============================================================
# ACEest Fitness & Gym - Rolling Update Deployment
# Task 6: Deployment Strategy 1 - Rolling Update
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aceest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest
  labels:
    app: aceest
    strategy: rolling
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      strategy: rolling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1    # At most 1 pod unavailable during update
      maxSurge: 1          # At most 1 extra pod during update
  template:
    metadata:
      labels:
        app: aceest
        strategy: rolling
        version: "3.2.4"
    spec:
      containers:
        - name: aceest
          image: yourdockerhubuser/aceest-fitness:3.2.4
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "3.2.4"
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-svc
  namespace: aceest
spec:
  selector:
    app: aceest
    strategy: rolling
  ports:
    - port: 80
      targetPort: 5000
  type: LoadBalancer
